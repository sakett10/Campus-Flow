services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: campusflow
      POSTGRES_PASSWORD: campusflow
      POSTGRES_DB: campusflow
    ports:
      - '5432:5432'
    volumes:
      - campusflow_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  campusflow_pg:
